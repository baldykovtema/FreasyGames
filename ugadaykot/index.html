  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body { margin: 0; font-family: Manrope, system-ui, sans-serif; color: var(--text); background: radial-gradient(circle at 50% -10%, #3d326a 0, #181a30 38%, var(--bg) 72%); display: flex; justify-content: center; }
  .app { width: min(720px, 100%); min-height: 100vh; padding: 60px 16px 32px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .top { width: 100%; display: flex; justify-content: space-between; align-items: center; }
  .brand { font-weight: 800; font-size: 20px; letter-spacing: -0.03em; }
  .brand span { color: var(--accent); }
  .ghost { font: inherit; font-size: 13px; font-weight: 700; color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; cursor: pointer; text-decoration: none; }
  .ghost:hover { color: var(--text); background: #ffffff10; }
  .cat { width: 170px; height: 170px; transition: transform .3s; }
  .cat.think { animation: tilt 2.4s ease-in-out infinite; }
  .cat.happy { animation: hop .6s ease-in-out 3; }
  @keyframes tilt { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
  @keyframes hop { 50% { transform: translateY(-18px); } }
  .bubble { position: relative; width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 22px 24px; text-align: center; }
  .bubble::before { content: ""; position: absolute; top: -9px; left: 50%; width: 16px; height: 16px; background: var(--panel); border-left: 1px solid var(--line); border-top: 1px solid var(--line); transform: translateX(-50%) rotate(45deg); }
  .bubble h1 { margin: 0 0 8px; font-size: clamp(28px, 6vw, 40px); letter-spacing: -0.04em; }
  .bubble h2 { margin: 0; font-size: clamp(20px, 4.4vw, 26px); line-height: 1.35; letter-spacing: -0.02em; }
  .bubble p { margin: 8px 0 0; color: var(--muted); line-height: 1.6; }
  .kicker { color: var(--accent); font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 10px; }
  .guess { font-size: clamp(30px, 7vw, 46px); font-weight: 800; letter-spacing: -0.04em; color: #fff; margin: 6px 0 2px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; width: 100%; }
  .btn { font: inherit; font-weight: 800; font-size: 16px; color: #171225; background: var(--accent); border: 0; border-radius: 14px; padding: 14px 20px; cursor: pointer; min-width: 150px; transition: transform .15s, filter .15s; }
  .btn:hover { transform: translateY(-2px); filter: brightness(1.08); }
  .btn.alt { color: var(--text); background: #ffffff12; border: 1px solid var(--line); }
  .btn.yes { background: var(--yes); } .btn.no { background: var(--no); }
  .btn.soft-yes { background: #b8f8d4; } .btn.soft-no { background: #ffc2d0; }
  .answers { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; width: 100%; }
  .answers .btn { min-width: 0; padding: 14px 6px; font-size: 14px; }
  .meter { width: 100%; display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 13px; font-weight: 700; }
  .meter .bar { flex: 1; height: 8px; background: #ffffff14; border-radius: 6px; overflow: hidden; }
  .meter i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #7b67fc, #bca0ff); transition: width .4s; }
  input { width: 100%; font: inherit; font-size: 17px; color: var(--text); background: #111321; border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; outline: none; margin-top: 14px; }
  input:focus { border-color: var(--accent); }
  .stats { color: var(--muted); font-size: 13px; text-align: center; }
  .hidden { display: none !important; }
  footer { margin-top: auto; color: #6f6d86; font-size: 12px; text-align: center; }
  footer a { color: var(--muted); }
  @media (max-width: 560px) { .answers { grid-template-columns: repeat(2, 1fr); } .answers .btn:first-child { grid-column: span 2; } .cat { width: 130px; height: 130px; } }
  @media (prefers-reduced-motion: reduce) { .cat.think, .cat.happy { animation: none; } }

      ['Axlebolt (Standoff 2)', { russian: 1, mobile: 1, shooters: 1, f2p: 1, onehit: 1 }],
      ['Скотт Коутон (FNaF)', { person: 1, usa: 1, horror: 1, onehit: 1, indie: 1, creature: 0.8 }],
      ['Тоби Фокс (Undertale)', { person: 1, usa: 1, indie: 1, pixel: 1, onehit: 0.6, fantasy: 0.8, creature: 0.6 }],
      ['ConcernedApe (Stardew Valley)', { person: 1, usa: 1, indie: 1, pixel: 1, onehit: 1 }],
      ['Team Cherry (Hollow Knight)', { oceania: 1, indie: 1, onehit: 1, creature: 1, fantasy: 1 }],
      ['Re-Logic (Terraria)', { usa: 1, indie: 1, pixel: 1, onehit: 1, fantasy: 0.8 }],
      ['King (Candy Crush)', { europe: 1, mobile: 1, f2p: 1, microsoft: 1, onehit: 0.8 }],
      ['Halfbrick (Fruit Ninja)', { oceania: 1, mobile: 1, onehit: 0.8, f2p: 0.7 }],
      ['ZeptoLab (Cut the Rope)', { russian: 1, mobile: 1, onehit: 0.8, creature: 1 }],
      ['Outfit7 (Говорящий Том)', { europe: 1, mobile: 1, f2p: 1, onehit: 1, creature: 1 }],
      ['Fingersoft (Hill Climb Racing)', { europe: 1, mobile: 1, f2p: 1, onehit: 1 }],
      ['Bandai Namco (Pac-Man)', { japan: 1, old: 1, creature: 0.5, fantasy: 0.5, sports: 0.3 }],
      ['Behaviour Interactive (Dead by Daylight)', { usa: 1, horror: 1, onehit: 0.8, old: 1 }],
      ['Алексей Пажитнов (Тетрис)', { person: 1, russian: 1, onehit: 1, old: 1 }],
    ],
  },
};

const ANSWERS = [['Да', 1, 'yes'], ['Скорее да', 0.75, 'soft-yes'], ['Не знаю', null, 'alt'], ['Скорее нет', 0.25, 'soft-no'], ['Нет', 0, 'no']];
const MAX_QUESTIONS = 25, MAX_GUESSES = 5;

/* ================= Память кота ================= */

// Если браузер не даёт сохранять (инкогнито, запрет сайта), кот помнит хотя бы до закрытия вкладки.
const memory = {};
const store = {
  get(key, fallback) {
    try { const v = localStorage.getItem(key); if (v) return JSON.parse(v); } catch { /* берём из памяти вкладки */ }
    return key in memory ? JSON.parse(memory[key]) : fallback;
  },
  set(key, value) {
    memory[key] = JSON.stringify(value);
    try { localStorage.setItem(key, memory[key]); } catch { /* останется в памяти вкладки */ }
  },
};
const normName = (s) => s.toLowerCase().replace(/ё/g, 'е').replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
const questionsText = (n) => n + ' ' + (n % 10 === 1 && n % 100 !== 11 ? 'вопрос' : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? 'вопроса' : 'вопросов');
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function candidates(mode) {
  // Выученное поверх встроенного: тот же вариант уточняется, новый добавляется в конец.
  const list = MODES[mode].items.map(([name, v]) => ({ name, v: { ...v } }));
  for (const l of store.get(MODES[mode].learned, [])) {
    const same = list.find((c) => normName(c.name) === normName(l.name));
    if (same) Object.assign(same.v, l.v); else list.push({ name: l.name, v: { ...l.v } });
  }
  return list;
}

/* ================= Как кот думает =================
   Каждому варианту — вес. Ответ, близкий к тому, что кот знает, вес сохраняет, далёкий — сильно уменьшает,
   но не обнуляет: игроки иногда ошибаются. Следующим идёт вопрос, который делит оставшиеся веса ближе всего пополам. */

let game = null;

function weights() {
  const w = game.list.map((c, i) => {
    if (game.rejected.has(i)) return 0;
    let p = 1;
    for (const [q, a] of game.answers) {
      if (a === null) continue;
      const v = c.v[q] ?? 0;
      p *= 1 - 0.8 * Math.abs(a - v);
    }
    return p;
  });
  const sum = w.reduce((s, x) => s + x, 0) || 1;
  return w.map((x) => x / sum);
}

function nextQuestion(w) {
  const asked = new Set(game.answers.map(([q]) => q));
  let best = null, bestScore = -1;
  for (const q of Object.keys(MODES[game.mode].questions)) {
    if (asked.has(q)) continue;
    let yes = 0;
    game.list.forEach((c, i) => { yes += w[i] * (c.v[q] ?? 0); });
    const score = 1 - Math.abs(2 * yes - 1);
    if (score > bestScore) { best = q; bestScore = score; }
  }
  return bestScore > 0.04 ? best : null;
}

function think() {
  const w = weights();
  let top = 0; w.forEach((x, i) => { if (x > w[top]) top = i; });
  const asked = game.answers.length;
  game.confidence = w[top];
  const q = nextQuestion(w);
  const ready = (w[top] > 0.8 && asked >= 8) || w[top] > 0.93 || asked >= MAX_QUESTIONS || !q;
  if (ready && game.guesses < MAX_GUESSES && w[top] > 0) return showGuess(top);
  if (!q || asked >= MAX_QUESTIONS + 5) return showLearn();
  game.question = q;
  showQuestion();
}

/* ================= Экраны ================= */

const $ = (id) => document.getElementById(id);
const screen = $('screen'), controls = $('controls'), cat = $('cat');

function mood(kind) {
  cat.classList.toggle('think', kind === 'think');
  cat.classList.toggle('happy', kind === 'happy');
  const look = kind === 'think' ? -6 : 6;
  $('pupilL').setAttribute('cx', 74 + look); $('pupilR').setAttribute('cx', 126 + look);
  $('mouth').setAttribute('d', kind === 'sad' ? 'M88 146 q12 -12 24 0' : kind === 'happy' ? 'M84 134 q16 20 32 0' : 'M88 138 q6 9 12 0 q6 9 12 0');
}
function buttons(list, cls = 'row') {
  controls.className = cls; controls.innerHTML = '';
  for (const [label, onClick, kind] of list) {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'btn ' + (kind || ''); b.textContent = label; b.onclick = onClick; controls.appendChild(b);
  }
}
function meter(show) {
  $('meter').classList.toggle('hidden', !show); $('restartTop').classList.toggle('hidden', !game);
  if (show) {
    const pct = Math.round(game.confidence * 100);
    $('qnum').textContent = `Вопрос ${game.answers.length + 1}`; $('conf').style.width = pct + '%'; $('confText').textContent = `уверен на ${pct}%`;
  }
}
function showStats() {
  const s = store.get('ugadaykot-stats', { won: 0, lost: 0 });
  $('stats').textContent = s.won + s.lost ? `Кот угадал ${s.won} из ${s.won + s.lost} раз` : '';
}

function showStart() {
  game = null; mood('idle'); meter(false); showStats();
  screen.innerHTML = `<h1>Угадайкот</h1><p>Загадай игру или разработчика, отвечай на мои вопросы — и я угадаю!<br>Я знаю все игры <b>FreasyGames</b> и десятки известных игр и студий.</p>`;
  buttons([['🎮 Загадать игру', () => start('game')], ['👩‍💻 Загадать разработчика', () => start('dev')]]);
}

function start(mode) {
  game = { mode, list: candidates(mode), answers: [], rejected: new Set(), guesses: 0, confidence: 0 };
  mood('think');
  screen.innerHTML = `<div class="kicker">${esc(MODES[mode].ask)}</div><h2>Загадал? Тогда начнём!</h2><p>Отвечай честно. Если не уверен — жми «Не знаю».</p>`;
  buttons([['Загадал!', think, 'yes'], ['Назад', showStart, 'alt']]);
  meter(false);
}

function showQuestion() {
  mood('think');
  screen.innerHTML = `<div class="kicker">${esc(MODES[game.mode].ask)}</div><h2>${esc(MODES[game.mode].questions[game.question])}</h2>`;
  const list = ANSWERS.map(([label, value, kind]) => [label, () => { game.answers.push([game.question, value]); think(); }, kind]);
  buttons(list, 'answers');
  if (game.answers.length) {
    const back = document.createElement('button'); back.type = 'button'; back.className = 'ghost'; back.textContent = '← Предыдущий вопрос'; back.style.gridColumn = '1 / -1';
    back.onclick = () => { game.answers.pop(); think(); }; controls.appendChild(back);
  }
  meter(true);
}

function showGuess(i) {
  game.guesses++; game.guessIndex = i; mood('idle');
  const pct = Math.round(game.confidence * 100);
  screen.innerHTML = `<div class="kicker">Я думаю, это…</div><div class="guess">${esc(game.list[i].name)}</div><p>Уверен на ${pct}% после ${game.answers.length} ${game.answers.length % 10 === 1 && game.answers.length % 100 !== 11 ? 'вопроса' : 'вопросов'}</p>`;
  buttons([['Да, угадал!', win, 'yes'], ['Нет', () => { game.rejected.add(i); think(); }, 'no']]);
  meter(false);
}

function win() {
  mood('happy');
  const s = store.get('ugadaykot-stats', { won: 0, lost: 0 }); s.won++; store.set('ugadaykot-stats', s);
  remember(game.list[game.guessIndex].name);
  screen.innerHTML = `<div class="kicker">Ура!</div><h2>Я угадал «${esc(game.list[game.guessIndex].name)}» за ${questionsText(game.answers.length)} 😺</h2><p>Попробуешь меня обхитрить?</p>`;
  buttons([['Сыграть ещё', () => start(game.mode), 'yes'], ['Сменить режим', showStart, 'alt']]);
  showStats(); meter(false);
}

function showLearn() {
  mood('sad'); meter(false);
  screen.innerHTML = `<div class="kicker">Сдаюсь</div><h2>Ты меня обыграл! Кого ты загадал?</h2><p>Я запомню, и в следующий раз угадаю.</p><input id="learnName" maxlength="60" placeholder="Название ${esc(MODES[game.mode].title === 'игру' ? 'игры' : 'разработчика')}">`;
  buttons([['Запомнить', learn, 'yes'], ['Не скажу', () => { lose(); showStart(); }, 'alt']]);
  const input = $('learnName'); input.focus(); input.addEventListener('keydown', (e) => { if (e.key === 'Enter') learn(); });
}

function learn() {
  const name = $('learnName').value.trim();
  if (!name) { $('learnName').focus(); return; }
  remember(name); lose();
  mood('happy');
  screen.innerHTML = `<div class="kicker">Запомнил!</div><h2>Теперь я знаю «${esc(name)}»</h2><p>Загадай ещё раз — проверим, научился ли я.</p>`;
  buttons([['Сыграть ещё', () => start(game.mode), 'yes'], ['Сменить режим', showStart, 'alt']]);
  showStats();
}

function lose() { const s = store.get('ugadaykot-stats', { won: 0, lost: 0 }); s.lost++; store.set('ugadaykot-stats', s); }

// Ответы игрока становятся знаниями кота о загаданном варианте (сохраняются в этом браузере).
function remember(name) {
  const key = MODES[game.mode].learned, learned = store.get(key, []);
  const known = game.list.find((c) => normName(c.name) === normName(name));
  const v = known ? { ...known.v } : {};
  for (const [q, a] of game.answers) if (a !== null) v[q] = known && q in known.v ? (known.v[q] + a) / 2 : a;
  const i = learned.findIndex((l) => normName(l.name) === normName(name));
  const entry = { name: known ? known.name : name, v };
  if (i >= 0) learned[i] = entry; else learned.push(entry);
  store.set(key, learned.slice(-200));
}

$('restartTop').onclick = showStart;
showStart();
</script>
