];

const JOKES = [
  'Почему кот не играет в прятки? Потому что всё равно все знают, что он в коробке.',
  'Программист заходит в лифт, а там написано «Не больше 8 человек». Он выходит и говорит: «Хорошо, что я не 9-й в массиве».',
  'Зомби в «Растениях против Зомби» тоже хотят здорово питаться. Просто их огород — твой.',
  'Мемный Кот разбился о букву «А» 50 раз. На 51-й он сказал: «Это была не буква, это была судьба».',
  'Шарик упал в «СТОП». Шарик: «Я просто хотел посмотреть, что там».',
  'Учитель: «Почему ты не сделал домашку?» Ученик: «Я ставил рекорд в Шариковом рекорде». Учитель: «И как?» Ученик: «Попал в СТОП».',
];
const FACTS = [
  'Кошки спят 12–16 часов в сутки. Мемный Кот — исключение, он всё время бежит.',
  'Первая компьютерная игра для развлечения появилась ещё в 1958 году — это был теннис на экране осциллографа.',
  'Осьминог имеет три сердца и голубую кровь.',
  'Мёд не портится: в египетских гробницах находили мёд, которому тысячи лет.',
  'Улитка может спать до трёх лет подряд.',
  'В «Шариковом рекорде» шарик отскакивает по законам физики, поэтому каждый бросок неповторим.',
  'Самая быстрая птица — сапсан: в пикировании он разгоняется больше 300 км/ч.',
];
const RIDDLES = [
  { q: 'Не лает, не кусает, а в дом не пускает. Что это?', a: ['замок'] },
  { q: 'Зимой и летом одним цветом. Что это?', a: ['ель', 'елка', 'ёлка', 'сосна'] },
  { q: 'Сидит дед, во сто шуб одет. Кто его раздевает, тот слёзы проливает. Кто это?', a: ['лук'] },
  { q: 'Что можно увидеть с закрытыми глазами?', a: ['сон'] },
  { q: 'Чем больше из неё берёшь, тем больше она становится. Что это?', a: ['яма'] },
  { q: 'Красная буква, через которую нельзя прыгать неправильно, в какой игре живёт?', a: ['кот', 'мемный кот', 'мемный кот прыг'] },
];

/* ================= Понимание сообщений ================= */

const norm = (s) => ' ' + s.toLowerCase().replace(/ё/g, 'е').replace(/[^a-zа-я0-9×+\-*/^().,:% ]/g, ' ').replace(/\s+/g, ' ').trim() + ' ';
const has = (t, words) => words.some((w) => t.includes(w));
const pick = (list) => list[Math.floor(Math.random() * list.length)];
const link = (g) => `[Играть в «${g.name}»](${g.url})`;
const plural = (n, one, few, many) => (n % 10 === 1 && n % 100 !== 11 ? one : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? few : many);

let riddle = null, lastGame = null, offer = null; // offer — что Фризик предложил повторить: 'riddle' или 'rps'

function findGame(t) {
  let best = null, score = 0;
  for (const g of GAMES) {
    const s = g.keys.filter((k) => t.includes(k)).length;
    if (s > score) { best = g; score = s; }
  }
  return best;
}

function newRiddle() { riddle = pick(RIDDLES); return riddle.q + '\n(Напиши ответ или «сдаюсь».)'; }

function reply(raw) {
  const t = norm(raw);
  const o = offer; offer = null;

  if (riddle) {
    const r = riddle; riddle = null;
    // Ответ ищется с начала слова, чтобы «цель» не засчитывалась за «ель», а «сосна» — за «сон».
    if (has(t, r.a.map((a) => ' ' + a.replace(/ё/g, 'е')))) { offer = 'riddle'; return pick(['Правильно! 🎉', 'Верно, молодец!', 'Точно! Ты разгадал.']) + ' Хочешь ещё загадку?'; }
    if (has(t, [' сдаюсь', ' не знаю', ' ответ', ' скажи'])) { offer = 'riddle'; return `Ответ: **${r.a[0]}**. Ещё одну?`; }
    // Другая просьба (пример, кнопка-подсказка, вопрос про игры) — не ответ на загадку.
    if (solveMath(raw) === null && !has(t, [' привет', ' игр', ' посчит', ' шутк', ' загад', ' скача', ' прилож', ' камень', ' ножниц', ' бумаг', ' что ты умеешь', ' помощ'])) { offer = 'riddle'; return `Не угадал. Правильный ответ: **${r.a[0]}**. Давай ещё одну?`; }
  }

  // «Да» / «давай» в ответ на «Ещё одну?» или «Ещё раунд?».
  if (o && t.trim().split(' ').length <= 3 && has(t, [' да ', ' давай', ' ага ', ' угу ', ' конечно', ' еще', ' го '])) {
    if (o === 'riddle') return newRiddle();
    return 'Давай! Напиши «камень», «ножницы» или «бумага».';
  }

  if (has(t, [' привет', ' здравств', ' хай ', ' ку ', ' хеллоу', ' hello', ' hi ', ' добрый день', ' доброе утро', ' добрый вечер', ' салют']))
    return pick(['Привет! Я Фризик, ИИ-помощник FreasyGames.', 'Здравствуй! Фризик на связи.', 'Привет-привет!']) + ' Могу рассказать про игры, посоветовать, во что поиграть, решить пример или пошутить. С чего начнём?';

  if (has(t, [' кто ты', ' ты кто', ' как тебя зовут', ' твое имя', ' что ты умеешь', ' что умеешь', ' помощь', ' help', ' команды']))
    return 'Я **Фризик** — ИИ-помощник сайта FreasyGames. Вот что я умею:\n• рассказать про любую игру FreasyGames и как в неё играть\n• посоветовать игру под настроение\n• рассказать про приложения и аккаунты\n• решить пример, например «15 * 4 + 2»\n• пошутить, загадать загадку, рассказать факт\n• подбросить монетку, бросить кубик, сыграть в камень-ножницы-бумагу\n• сказать, который час';

  if (has(t, [' спасибо', ' благодар', ' спс', ' thanks'])) return pick(['Пожалуйста! Обращайся 😊', 'Рад помочь!', 'Всегда пожалуйста!']);
  if (has(t, [' пока ', ' до свидан', ' bye', ' увидимся'])) return 'Пока! Заходи поиграть на FreasyGames 👋';

  const math = solveMath(raw);
  if (math !== null) return math;

  // Раньше игр: в «который час» есть буквы «кот».
  if (has(t, [' который час', ' сколько времени', ' сколько сейчас времени', ' сколько время', ' время сейчас', ' текущее время'])) return 'Сейчас ' + new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }) + '.';
  if (has(t, [' дата ', ' какая дата', ' какое число', ' какое сегодня', ' какой день', ' какой сегодня'])) return 'Сегодня ' + new Date().toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).replace(/\.$/, '') + '.';
  if (has(t, [' монет', ' орел или решка', ' орёл или решка'])) return 'Подбрасываю… ' + pick(['**Орёл!**', '**Решка!**']);
  if (has(t, [' кубик', ' брось кост', ' кости '])) return 'Бросаю кубик… выпало **' + (1 + Math.floor(Math.random() * 6)) + '** 🎲';
  const range = t.match(/случайн[а-я]* число(?: от (\d+) до (\d+))?/);
  if (range) { const lo = +(range[1] || 1), hi = +(range[2] || 100); return 'Случайное число: **' + (Math.min(lo, hi) + Math.floor(Math.random() * (Math.abs(hi - lo) + 1))) + '**'; }


  if (has(t, [' какие игры', ' список игр', ' все игры', ' что за игры', ' какие есть', ' сколько игр', ' что есть на', ' игры на сайте', ' что на freasy', ' что на фризи']))
    return `На FreasyGames сейчас ${GAMES.length} ${plural(GAMES.length, 'бесплатная игра', 'бесплатные игры', 'бесплатных игр')}:\n` + GAMES.map((g) => `• **${g.name}** — ${g.genre}`).join('\n') + `\n\nПро любую могу рассказать подробнее. Весь каталог: [FreasyGames](${SITE})`;

  if (has(t, [' посовет', ' во что поиграть', ' что поиграть', ' порекоменд', ' скучно', ' нечего делать', ' какую игру', ' лучшая игра', ' выбери игру'])) {
    const g = GAMES.find((x) => has(t, x.mood)) || pick(GAMES);
    lastGame = g;
    return `Советую **${g.name}** (${g.genre}). ${g.about.split('. ')[0]}.\n${link(g)}`;
  }

  if (has(t, [' скача', ' прилож', ' android', ' андроид', ' apk', ' мак ', ' mac', ' macos', ' dmg', ' windows', ' виндовс', ' компьютер', ' телефон', ' установ']))
    return `У FreasyGames есть приложения:\n• **Android** — файл APK, около 11 МБ\n• **macOS** — файл DMG\n• **Windows** — ZIP-архив, распакуй и запусти FreasyGames.exe\nСсылки на скачивание есть внизу страницы [FreasyGames](${SITE}). А в браузере все игры работают и без установки.`;

  if (has(t, ['аккаунт', 'войти', ' вход', 'регистр', 'пароль', 'логин', ' ник ']))
    return 'Аккаунт на FreasyGames один для всех игр сайта и для «Растений против Зомби». Почта не нужна: только ник (латиницей, от 3 символов) и пароль от 6 символов. С аккаунтом можно играть онлайн, публиковать свои уровни и попадать в таблицу рекордов.';

  if (has(t, [' рекорд', ' лидер', ' таблиц'])) {
    const boards = GAMES.filter((g) => g.board), b = GAMES.find((g) => g.id === 'balls');
    return `Таблицы рекордов есть в ${boards.map((g) => `«${g.name}»`).join(', ').replace(/, ([^,]+)$/, ' и $1')}. Чтобы попасть в таблицу, войди в аккаунт.\n${link(b)}`;
  }

  if (has(t, [' freasy makes', ' фризи мейкс', ' заказ', ' сделать игру', ' сделай игру', ' создать игру', ' свою игру', ' свой сайт', ' сделать сайт']))
    return `Свою игру или сайт можно заказать на **Freasy Makes**: опиши идею, а готовый файл появится у тебя в «Моих заказах». Есть бесплатный план.\n[Открыть Freasy Makes](${MAKES})`;

  const game = findGame(t) || (has(t, [' она ', ' в нее', ' в неё', ' эту игру', ' там ', ' как играть', ' управлен', ' совет', ' как пройти']) ? lastGame : null);
  if (game) {
    lastGame = game;
    if (has(t, [' как играть', ' управлен', ' правил', ' как прыг', ' кнопк', ' что нажимать', ' как в нее', ' как в неё'])) return `**${game.name}** — как играть:\n${game.how}\n${link(game)}`;
    if (has(t, [' совет', ' как пройти', ' не могу', ' сложно', ' трудно', ' помоги', ' секрет', ' лайфхак'])) return `Совет по **${game.name}**: ${game.tips}`;
    return `**${game.name}** (${game.genre}). ${game.about}\n${link(game)}\n\nСпроси «как играть?» или «дай совет» — расскажу подробнее.`;
  }
  if (has(t, [' игр', ' поиграть', ' freasy', ' фризи', ' фризик гейм', ' сайт']))
    return `На FreasyGames есть ${GAMES.map((g) => `«${g.name}»`).join(', ').replace(/, ([^,]+)$/, ' и $1')}. Спроси про любую или напиши «посоветуй игру».`;

  if (has(t, [' шутк', ' анекдот', ' рассмеши', ' смешн', ' пошути', ' юмор'])) return pick(JOKES) + ' 😄';
  if (has(t, [' факт', ' интересн', ' удиви', ' знаешь ли'])) return 'Интересный факт: ' + pick(FACTS);
  if (has(t, [' загадк', ' загадай'])) return newRiddle();

  const rps = { камень: 0, ножницы: 1, бумага: 2 }, mine = Object.keys(rps).find((k) => t.includes(' ' + k));
  if (mine) {
    const bot = pick(Object.keys(rps)), a = rps[mine], b = rps[bot];
    const result = a === b ? 'Ничья!' : (a + 1) % 3 === b ? 'Ты победил! 🎉' : 'Я победил! 😎';
    offer = 'rps';
    return `Я выбираю **${bot}**. ${result} Ещё раунд?`;
  }
  if (has(t, [' камень ножницы', ' сыграем', ' поиграем с тобой', ' игру с тобой'])) return 'Давай в камень-ножницы-бумагу! Напиши «камень», «ножницы» или «бумага».';

  if (has(t, [' как дела', ' как ты', ' как жизнь'])) return pick(['Отлично! Только что прошёл «Ночной тыгыдык» 😎 А у тебя как?', 'Хорошо! Жду, когда ты спросишь про игры.']);
  if (has(t, [' молодец', ' круто', ' класс', ' супер', ' люблю'])) return 'Спасибо! Ты тоже крутой 😊';

  return pick(['Хм, не совсем понял.', 'Пока не знаю, что ответить.', 'Это для меня сложновато.']) + ' Я могу рассказать про игры FreasyGames, посоветовать игру, решить пример, пошутить или загадать загадку. Попробуй кнопки ниже!';
}

/* Примеры вида «15 * 4 + 2» или «сколько будет 7 умножить на 8». Считает без eval. */
function solveMath(raw) {
  let s = raw.toLowerCase().replace(/ё/g, 'е')
    .replace(/сколько будет|посчитай|вычисли|реши|чему равно|=|\?/g, ' ')
    .replace(/умножить на|умножь на|умножить|x|х/g, '*').replace(/разделить на|раздели на|делить на|:/g, '/')
    .replace(/плюс/g, '+').replace(/минус/g, '-').replace(/в степени/g, '^').replace(/,/g, '.');
  if (!/\d/.test(s) || !/[+\-*/^]/.test(s.replace(/^\s*-/, ''))) return null;
  s = s.replace(/\s+/g, '');
  if (!/^[\d.+\-*/^()]+$/.test(s)) return null;
  let i = 0;
  const eat = (c) => (s[i] === c ? (i++, true) : false);
  function num() {
    if (eat('(')) { const v = expr(); if (!eat(')')) throw 0; return v; }
    const m = s.slice(i).match(/^\d+(\.\d+)?/); if (!m) throw 0;
    i += m[0].length; return +m[0];
  }
  // Унарный минус слабее степени: -2^2 = -4, а 2^-1 = 0,5.
  function unary() { return eat('-') ? -unary() : pow(); }
  function pow() { const b = num(); return eat('^') ? Math.pow(b, unary()) : b; }
  function term() { let v = unary(); for (;;) { if (eat('*')) v *= unary(); else if (eat('/')) { const d = unary(); if (d === 0) throw 'zero'; v /= d; } else return v; } }
  function expr() { let v = term(); for (;;) { if (eat('+')) v += term(); else if (eat('-')) v -= term(); else return v; } }
  try {
    const v = expr();
    if (i !== s.length || !isFinite(v)) return null;
    const shown = Math.abs(v) >= 1e15 ? v.toExponential(4) : (Math.round(v * 1e8) / 1e8 || 0).toLocaleString('ru-RU', { maximumFractionDigits: 8 });
    return `${s.replace(/\*/g, ' × ').replace(/\//g, ' ÷ ').replace(/\+/g, ' + ').replace(/(\d)-/g, '$1 − ')} = **${shown}**`;
  } catch (e) {
    return e === 'zero' ? 'На ноль делить нельзя — даже Фризику 🙂' : null;
  }
}

/* ================= Чат ================= */

const chat = document.getElementById('chat'), form = document.getElementById('form'), input = document.getElementById('input');
const CHIPS = ['Какие есть игры?', 'Посоветуй игру', 'Как играть в Мемного Кота?', 'Расскажи шутку', 'Загадай загадку', 'Сколько будет 17 * 23?', 'Где скачать приложение?', 'Камень'];
const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// Ответы бота могут содержать **жирный** текст и [ссылки](https://...); всё остальное экранируется.
const format = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\[([^\]]+)\]\((https:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

let history = [];
try { history = JSON.parse(localStorage.getItem('frizik-chat') || '[]'); } catch { history = []; }
const persist = () => { try { localStorage.setItem('frizik-chat', JSON.stringify(history.slice(-60))); } catch { /* без истории */ } };

function bubble(who, html) {
  const row = document.createElement('div'); row.className = 'msg ' + who;
  if (who === 'bot') { const a = document.createElement('div'); a.className = 'avatar small'; a.textContent = '✦'; a.setAttribute('aria-hidden', 'true'); row.appendChild(a); }
  const b = document.createElement('div'); b.className = 'bubble'; b.innerHTML = html; row.appendChild(b);
  chat.appendChild(row); chat.scrollTop = chat.scrollHeight;
  return row;
}
function add(who, text, save = true) {
  bubble(who, who === 'bot' ? format(text) : esc(text));
  if (save) { history.push([who, text]); persist(); }
}

let busy = false, typingTimer = 0;
function ask(text) {
  text = text.trim(); if (!text || busy) return;
  add('me', text); input.value = ''; busy = true;
  const answer = reply(text);
  const dots = bubble('bot', '<i></i><i></i><i></i>'); dots.classList.add('typing');
  typingTimer = setTimeout(() => { dots.remove(); add('bot', answer); busy = false; input.focus(); }, Math.min(1400, 450 + answer.length * 6));
}

function greet() { add('bot', 'Привет! Я **Фризик**, ИИ-помощник FreasyGames 👋\nЯ знаю всё про игры на сайте, могу посоветовать, во что поиграть, решить пример, пошутить или загадать загадку. Спрашивай!'); }

form.addEventListener('submit', (e) => { e.preventDefault(); ask(input.value); });
document.getElementById('clearBtn').onclick = () => { clearTimeout(typingTimer); busy = false; history = []; persist(); chat.innerHTML = ''; riddle = null; lastGame = null; offer = null; greet(); };
const chips = document.getElementById('chips');
for (const c of CHIPS) { const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = c; b.onclick = () => ask(c); chips.appendChild(b); }

if (history.length) for (const [who, text] of history) add(who, text, false); else greet();
</script>
