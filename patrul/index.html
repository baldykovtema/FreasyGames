<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<script src="../shared/session.js?v=2"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Звёздный патруль</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#05030f;color:#fff;font-family:-apple-system,"Segoe UI",system-ui,sans-serif;overflow:hidden;user-select:none}
#wrap{position:fixed;inset:0;display:grid;place-items:center;touch-action:none}
canvas{display:block;touch-action:none;cursor:none}
.ui{position:absolute;inset:0;display:none;align-items:center;justify-content:center;justify-content:safe center;flex-direction:column;gap:12px;background:#05030fd9;text-align:center;padding:20px;overflow:auto}
.ui.on{display:flex}
h1{margin:0;font-size:50px;line-height:1;background:linear-gradient(#7ef9ff,#4b6bff);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:3px;filter:drop-shadow(0 0 14px #4b6bff)}
h2{margin:0;font-size:32px;color:#7ef9ff}
.btn{background:linear-gradient(#4b8bff,#3a4bff);color:#fff;font-weight:800;font-size:19px;border:0;border-radius:12px;padding:12px 28px;cursor:pointer;box-shadow:0 0 18px #3a4bff88;min-width:230px}
.btn:hover{filter:brightness(1.15)}
.btn.sec{background:#1d1a3a;box-shadow:none;border:1px solid #3a3570}
.btn.gold{background:linear-gradient(#ffd84d,#ff9f1a);color:#3a2000;box-shadow:0 0 18px #ff9f1a66}
.muted{color:#9c97c9;font-size:14px;line-height:1.5}
.shop{display:grid;grid-template-columns:repeat(2,minmax(200px,260px));gap:10px}
@media(max-width:470px){.shop{grid-template-columns:minmax(0,320px);width:100%;justify-content:center}}
.up{background:#15122e;border:1px solid #2d2860;border-radius:12px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:6px}
.up b{font-size:15px}
.bar{display:flex;gap:3px}.bar i{flex:1;height:6px;border-radius:3px;background:#2d2860}.bar i.on{background:#7ef9ff}
.up button{background:linear-gradient(#ffd84d,#ff9f1a);color:#3a2000;font-weight:800;border:0;border-radius:8px;padding:6px;cursor:pointer}
.up button:disabled{background:#2d2860;color:#777;cursor:not-allowed}
.ships{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.ship{width:94px;padding:8px;border-radius:12px;background:#15122e;border:2px solid #2d2860;cursor:pointer;font-size:12px}
.ship.on{border-color:#7ef9ff}
.ship canvas{box-shadow:none;cursor:pointer;margin:0 auto}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="600" height="840"></canvas></div>

<div class="ui on" id="menu">
  <h1>ЗВЁЗДНЫЙ<br>ПАТРУЛЬ</h1>
  <div class="muted">Мышь, стрелки или джойстик на телефоне — управление. Стрельба автоматическая.<br>Каждые 5 волн — босс и точка сохранения.</div>
  <button class="btn" id="bPlay">▶ Новая игра</button>
  <button class="btn gold" id="bCont">⟳ Продолжить</button>
  <button class="btn sec" id="bShop">🛠 Мастерская</button>
  <button class="btn sec" data-lb>🏆 Таблица лидеров</button>
  <div class="muted" id="menuInfo"></div>
  <div style="display:flex;gap:8px"><button class="btn sec" style="min-width:0;font-size:13px;padding:8px 14px" id="bReset">Сбросить прогресс</button><a class="btn sec" style="min-width:0;font-size:13px;padding:8px 14px;text-decoration:none" href="../">← FreasyGames</a></div>
</div>
<div class="ui" id="shopUI">
  <h2>🛠 Мастерская</h2><div class="muted" id="shopCoins"></div>
  <div class="shop" id="shopGrid"></div>
  <div class="muted">Корабли</div><div class="ships" id="shipGrid"></div>
  <button class="btn sec" data-back>Назад</button>
</div>
<div class="ui" id="overUI"><h2 id="overT">Корабль уничтожен</h2><div class="muted" id="overInfo" style="font-size:17px"></div><button class="btn gold" id="bOverCont">⟳ С точки сохранения</button><button class="btn" id="bAgain">▶ Сначала</button><button class="btn sec" id="bOverShop">🛠 Мастерская</button><button class="btn sec" data-lb>🏆 Таблица лидеров</button><button class="btn sec" data-back>Меню</button><div class="muted" id="lbNote"></div></div>
<div class="ui" id="pauseUI"><h2>Пауза</h2><button class="btn" id="bResume">Продолжить</button><button class="btn sec" id="bQuit">Выйти в меню</button><div class="muted">Монеты уже сохранены</div></div>

<script src="../shared/leaderboard.js"></script>
<script src="../shared/rewards.js"></script>
<script src="../shared/joystick.js"></script>
<script>
"use strict";
const $=s=>document.querySelector(s);
const cv=$('#c'),g=cv.getContext('2d');let W=600,H=840;
// The field takes the whole screen: at least 420 wide and 840 tall in game units, the rest follows the screen's shape.
function fit(){const s=Math.min(innerHeight/840,innerWidth/420);W=Math.min(1800,Math.round(innerWidth/s));H=Math.round(innerHeight/s);
  const dpr=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(W*s*dpr);cv.height=Math.round(H*s*dpr);g.setTransform(cv.width/W,0,0,cv.height/H,0,0);
  cv.style.width=W*s+'px';cv.style.height=H*s+'px';
  // the game state is declared further down, so the first call (before it exists) skips this
  try{if(P){P.x=Math.max(24,Math.min(W-24,P.x));P.y=Math.max(60,Math.min(H-40,P.y));}for(const st of stars){if(st.x>W)st.x=Math.random()*W;if(st.y>H)st.y=Math.random()*H;}}catch(e){}}
addEventListener('resize',fit);fit();

/* ---------- сохранение ---------- */
const KEY='zvezdny_patrul_v1';
const UPS=[
  {k:'dmg',n:'💥 Урон',d:'Сильнее выстрелы',max:8,cost:l=>40+l*45},
  {k:'rate',n:'⚡ Скорострельность',d:'Стреляет чаще',max:8,cost:l=>40+l*45},
  {k:'hp',n:'❤️ Броня',d:'+1 жизнь',max:6,cost:l=>60+l*60},
  {k:'guns',n:'🔱 Пушки',d:'Больше стволов',max:3,cost:l=>150+l*200},
  {k:'magnet',n:'🧲 Магнит',d:'Притягивает монеты',max:5,cost:l=>30+l*35},
  {k:'shield',n:'🛡 Щит на старте',d:'Секунды защиты',max:5,cost:l=>50+l*50},
];
const SHIPS=[{n:'Стриж',c:'#7ef9ff',a:'#3a8bff',p:0},{n:'Оса',c:'#ffd84d',a:'#ff7a1a',p:150},{n:'Рубин',c:'#ff4f6d',a:'#a0153a',p:300},{n:'Изумруд',c:'#4dff9a',a:'#0f8a4d',p:500},{n:'Призрак',c:'#e0d0ff',a:'#7a4bff',p:900}];
let save=load();
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.v===1)return s;}catch(e){}return {v:1,coins:0,best:0,bestWave:0,check:0,ups:{dmg:0,rate:0,hp:0,guns:0,magnet:0,shield:0},ship:0,owned:[0],kills:0};}
function store(){try{localStorage.setItem(KEY,JSON.stringify(save));}catch(e){}}

/* ---------- звук ---------- */
let AC;function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC;}
function tone(f0,f1,d,type='square',v=.08,noise=false){if(!AC&&navigator.userActivation&&!navigator.userActivation.hasBeenActive)return;try{const c=ac(),t=c.currentTime,gn=c.createGain();let src;
  if(noise){const b=c.createBuffer(1,c.sampleRate*d,c.sampleRate),dd=b.getChannelData(0);for(let i=0;i<dd.length;i++)dd[i]=Math.random()*2-1;src=c.createBufferSource();src.buffer=b;const f=c.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(Math.max(40,f1),t+d);src.connect(f);f.connect(gn);}
  else{src=c.createOscillator();src.type=type;src.frequency.setValueAtTime(f0,t);src.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+d);src.connect(gn);}
  gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.001,t+d);gn.connect(c.destination);src.start(t);src.stop(t+d);}catch(e){}}
let lastShot=0;
const S={shot:()=>{const n=performance.now();if(n-lastShot>70){lastShot=n;tone(900,300,.06,'square',.03);}},boom:()=>tone(1200,60,.4,'',.25,true),big:()=>tone(800,30,1.2,'',.4,true),coin:()=>tone(1300,1800,.08,'sine',.08),hurt:()=>tone(300,80,.3,'sawtooth',.15),power:()=>[400,600,900].forEach((f,i)=>setTimeout(()=>tone(f,f*1.5,.12,'triangle',.12),i*70)),warn:()=>[0,1,2].forEach(i=>setTimeout(()=>tone(220,200,.25,'sawtooth',.12),i*350))};

/* ---------- игра ---------- */
let state='menu',P,bul=[],ebul=[],en=[],drops=[],parts=[],stars=[],wave=0,score=0,runCoins=0,waveQ=[],waveT=0,banner=null,shake=0,keys={},ptr=null,frameN=0;
for(let i=0;i<120;i++)stars.push({x:Math.random()*W,y:Math.random()*H,z:Math.random()*2+.3});
function newRun(fromWave){
  const u=save.ups;
  P={x:W/2,y:H-120,hp:3+u.hp,maxHp:3+u.hp,cool:0,inv:60*(1+u.shield),dbl:0,dead:false};
  bul=[];ebul=[];en=[];drops=[];parts=[];score=0;runCoins=0;wave=fromWave||0;waveQ=[];waveT=60;runStart=wave;runT=0;
  state='play';showUI(null);nextWave();chanceUsed=false;chance.hide();

}
function nextWave(){
  wave++;const boss=wave%5===0;waveQ=[];
  if(boss){waveQ.push({t:60,type:'boss'});banner={t:150,txt:'⚠ БОСС ⚠',sub:'Волна '+wave};S.warn();}
  else{
    banner={t:110,txt:'Волна '+wave,sub:''};
    const n=6+wave*2;let t=50;
    for(let i=0;i<n;i++){const r=Math.random();let type='basic';
      if(wave>=2&&r<.25)type='zig';if(wave>=3&&r>.8)type='gunner';if(wave>=6&&r>.92)type='tank';if(wave>=4&&r>.55&&r<.65)type='kami';
      waveQ.push({t,type,x:60+Math.random()*(W-120)});t+=Math.max(12,40-wave*2)+Math.random()*20;}
  }
  waveT=0;
}
const ETYPES={
  basic:{hp:2,r:18,sp:2.2,pts:10,col:'#ff5f7e'},zig:{hp:2,r:16,sp:2.4,pts:15,col:'#ffb84d'},
  gunner:{hp:5,r:22,sp:1.2,pts:25,col:'#c27bff'},tank:{hp:16,r:30,sp:.8,pts:60,col:'#5fd1ff'},kami:{hp:1,r:14,sp:5,pts:20,col:'#ff3b3b'},
};
function spawn(q){
  const hpMul=1+wave*0.12;
  if(q.type==='boss'){const lvl=wave/5;en.push({type:'boss',x:W/2,y:-120,ty:150,r:70,hp:220*lvl+wave*30,max:220*lvl+wave*30,t:0,col:'#ff4f6d',pts:500*lvl,boss:true});return;}
  const e=ETYPES[q.type];en.push({type:q.type,x:q.x,y:-40,r:e.r,hp:e.hp*hpMul,max:e.hp*hpMul,sp:e.sp*(1+wave*0.02),t:Math.random()*100,col:e.col,pts:e.pts,cool:60+Math.random()*60,ox:q.x});
}
function boom(x,y,col,n=20,sp=5){for(let i=0;i<n;i++){const a=Math.random()*7,v=Math.random()*sp;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,col,r:1+Math.random()*3});}}
function hurt(){if(P.inv>0)return;P.hp--;P.inv=90;shake=12;S.hurt();boom(P.x,P.y,'#fff',20,4);if(P.hp<=0)gameOver();}
function gameOver(){P.dead=true;S.big();boom(P.x,P.y,SHIPS[save.ship].c,80,8);state='dying';
  setTimeout(()=>{state='over';
    const newBest=score>save.best,run={new_score:score,new_wave:wave,new_start:runStart,new_time:Math.floor(runT)};
    if(newBest)save.runScore=run;if(wave>save.bestWave)save.runWave=run;
    save.best=Math.max(save.best,score);save.bestWave=Math.max(save.bestWave,wave);store();lb.submit(run);
    $('#overT').textContent=newBest?'🏆 Новый рекорд!':'Корабль уничтожен';
    $('#overInfo').innerHTML='Очки: <b>'+score+'</b> (рекорд '+save.best+')<br>Волна: '+wave+'<br>Собрано монет: 🪙 '+runCoins+' (всего '+save.coins+')';
    $('#bOverCont').style.display=save.check>0?'':'none';$('#bOverCont').textContent='⟳ С волны '+(save.check+1);
    showUI('overUI');if(!chanceUsed)chance.show();},1400);}
// Once a run, an ad repairs the ship on the same wave, with a moment of shield.
let chanceUsed=false;
const chance=FreasyRewards.offer({host:'#overUI',before:'#bOverCont',name:'patrul-revive',label:'🎬 Починить корабль за рекламу',onReward:()=>{
  chanceUsed=true;P.dead=false;P.hp=P.maxHp;P.inv=180;ebul=[];en=en.filter(e=>e.boss||e.y<H*0.4);
  state='play';showUI(null);}});
function update(){
  frameN++;for(const s of stars){s.y+=s.z*(state==='play'?2:0.6);if(s.y>H){s.y=0;s.x=Math.random()*W;}}
  if(state!=='play'&&state!=='dying'){return;}
  for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vx*=.96;p.vy*=.96;p.life-=.02;}parts=parts.filter(p=>p.life>0);
  if(shake>0)shake--;
  if(state==='dying')return;
  runT+=1/60;
  const u=save.ups;
  // движение
  let dx=0,dy=0;if(keys.ArrowLeft||keys.KeyA)dx-=1;if(keys.ArrowRight||keys.KeyD)dx+=1;if(keys.ArrowUp||keys.KeyW)dy-=1;if(keys.ArrowDown||keys.KeyS)dy+=1;
  if(!dx&&!dy&&joy.active){dx=joy.x*1.25;dy=joy.y*1.25;}
  if(dx||dy){P.x+=dx*7;P.y+=dy*7;ptr=null;}else if(ptr){P.x+=(ptr.x-P.x)*.25;P.y+=(ptr.y-P.y)*.25;}
  P.x=Math.max(24,Math.min(W-24,P.x));P.y=Math.max(60,Math.min(H-40,P.y));
  if(P.inv>0)P.inv--;if(P.dbl>0)P.dbl--;
  // стрельба
  if(--P.cool<=0){P.cool=Math.max(4,14-u.rate*1.2)*(P.dbl>0?.6:1);const dmg=1+u.dmg*0.5;const guns=1+u.guns+(P.dbl>0?1:0);
    for(let i=0;i<guns;i++){const off=(i-(guns-1)/2);bul.push({x:P.x+off*12,y:P.y-24,vx:off*0.9,vy:-13,dmg});}S.shot();}
  for(const b of bul){b.x+=b.vx;b.y+=b.vy;}bul=bul.filter(b=>b.y>-20&&b.x>-20&&b.x<W+20&&!b.dead);
  for(const b of ebul){b.x+=b.vx;b.y+=b.vy;if(Math.hypot(b.x-P.x,b.y-P.y)<b.r+12){b.dead=true;hurt();}}ebul=ebul.filter(b=>!b.dead&&b.y<H+20&&b.y>-40&&b.x>-40&&b.x<W+40);
  // волна
  waveT++;while(waveQ.length&&waveQ[0].t<=waveT)spawn(waveQ.shift());
  if(!waveQ.length&&!en.length){
    const cp=wave%5===0;if(cp){save.check=Math.max(save.check,wave);store();}
    nextWave();if(cp)banner={t:120,txt:'✔ Сохранено',sub:'Точка сохранения: волна '+(wave-1)};}
  // враги
  for(const e of en){e.t++;
    if(e.boss){if(e.y<e.ty)e.y+=1.5;else{e.x=W/2+Math.sin(e.t/70)*(W/2-90);
      const ph=e.hp<e.max/2?2:1;
      if(e.t%(ph===2?40:60)===0)for(let a=-2;a<=2;a++){const ang=Math.PI/2+a*0.22;ebul.push({x:e.x,y:e.y+50,vx:Math.cos(ang)*4,vy:Math.sin(ang)*4,r:7,col:'#ff4f6d'});}
      if(e.t%(ph===2?90:150)===0)for(let k=0;k<16;k++){const ang=k/16*Math.PI*2+e.t;ebul.push({x:e.x,y:e.y,vx:Math.cos(ang)*3,vy:Math.sin(ang)*3,r:6,col:'#ffd84d'});}
      if(e.t%25===0&&ph===2){const a=Math.atan2(P.y-e.y,P.x-e.x);ebul.push({x:e.x,y:e.y+40,vx:Math.cos(a)*6,vy:Math.sin(a)*6,r:5,col:'#fff'});}}}
    else{
      if(e.type==='zig'){e.y+=e.sp;e.x=e.ox+Math.sin(e.t/20)*70;}
      else if(e.type==='kami'){if(e.y<120)e.y+=e.sp*.5;else{if(!e.dir){const a=Math.atan2(P.y-e.y,P.x-e.x);e.dir=[Math.cos(a)*e.sp*1.4,Math.sin(a)*e.sp*1.4];}e.x+=e.dir[0];e.y+=e.dir[1];}}
      else{e.y+=e.sp;}
      if((e.type==='gunner'||e.type==='tank')&&--e.cool<=0&&e.y>0){e.cool=e.type==='tank'?70:100;const a=Math.atan2(P.y-e.y,P.x-e.x);ebul.push({x:e.x,y:e.y,vx:Math.cos(a)*4.2,vy:Math.sin(a)*4.2,r:6,col:e.col});}
    }
    if(Math.hypot(e.x-P.x,e.y-P.y)<e.r+14){if(!e.boss){e.hp=0;e.noPts=false;}hurt();}
    for(const b of bul)if(!b.dead&&Math.hypot(b.x-e.x,b.y-e.y)<e.r+4){b.dead=true;e.hp-=b.dmg;e.flash=4;boom(b.x,b.y,'#fff',3,2);}
    if(e.hp<=0&&!e.gone){e.gone=true;score+=e.pts;save.kills++;
      if(e.boss){S.big();shake=25;boom(e.x,e.y,'#ff4f6d',120,10);boom(e.x,e.y,'#ffd84d',80,7);for(let i=0;i<25;i++)drops.push({x:e.x+(Math.random()-.5)*120,y:e.y+(Math.random()-.5)*80,type:'coin',v:5,vy:1+Math.random()*2});drops.push({x:e.x,y:e.y,type:'heal',vy:1.5});}
      else{S.boom();shake=Math.max(shake,4);boom(e.x,e.y,e.col,24,5);
        const nc=e.type==='tank'?5:e.type==='gunner'?2:1;for(let i=0;i<nc;i++)if(Math.random()<.7)drops.push({x:e.x+(Math.random()-.5)*20,y:e.y,type:'coin',v:1,vy:1.5+Math.random()});
        const r=Math.random();if(r<.04)drops.push({x:e.x,y:e.y,type:'heal',vy:1.5});else if(r<.09)drops.push({x:e.x,y:e.y,type:'power',vy:1.5});else if(r<.12)drops.push({x:e.x,y:e.y,type:'shield',vy:1.5});}}
  }
  en=en.filter(e=>!e.gone&&e.y<H+60&&e.y>-200&&e.x>-80&&e.x<W+80);
  // подбор
  const mr=40+u.magnet*35;
  for(const d of drops){const dist=Math.hypot(d.x-P.x,d.y-P.y);
    if(d.type==='coin'&&dist<mr){d.x+=(P.x-d.x)*.15;d.y+=(P.y-d.y)*.15;}else d.y+=d.vy;
    if(dist<26){d.got=true;
      if(d.type==='coin'){runCoins+=d.v||1;save.coins+=d.v||1;S.coin();if(frameN%20===0)store();}
      else if(d.type==='heal'){P.hp=Math.min(P.maxHp,P.hp+1);S.power();}
      else if(d.type==='power'){P.dbl=600;S.power();}
      else if(d.type==='shield'){P.inv=Math.max(P.inv,300);S.power();}}}
  drops=drops.filter(d=>!d.got&&d.y<H+20);
  if(banner&&--banner.t<=0)banner=null;
}
function shipPath(c,x,y,s,col,acc,flame){
  c.save();c.translate(x,y);c.scale(s,s);
  if(flame){c.fillStyle='#ffb84d';c.beginPath();c.moveTo(-7,18);c.lineTo(0,18+10+Math.random()*12);c.lineTo(7,18);c.fill();}
  c.fillStyle=acc;c.beginPath();c.moveTo(-24,16);c.lineTo(-8,-2);c.lineTo(-8,14);c.closePath();c.moveTo(24,16);c.lineTo(8,-2);c.lineTo(8,14);c.closePath();c.fill();
  c.fillStyle=col;c.beginPath();c.moveTo(0,-26);c.quadraticCurveTo(12,-6,10,18);c.lineTo(-10,18);c.quadraticCurveTo(-12,-6,0,-26);c.fill();
  c.fillStyle='#11163a';c.beginPath();c.ellipse(0,-6,4.5,8,0,0,7);c.fill();c.restore();
}
function drawEnemy(e){
  g.save();g.translate(e.x,e.y);const col=e.flash>0?'#fff':e.col;if(e.flash>0)e.flash--;
  g.fillStyle=col;g.shadowColor=e.col;g.shadowBlur=12;
  if(e.boss){g.beginPath();g.moveTo(-90,-20);g.lineTo(-40,-50);g.lineTo(40,-50);g.lineTo(90,-20);g.lineTo(60,30);g.lineTo(20,55);g.lineTo(-20,55);g.lineTo(-60,30);g.closePath();g.fill();
    g.shadowBlur=0;g.fillStyle='#2a0a14';g.beginPath();g.arc(0,0,26,0,7);g.fill();g.fillStyle='#ffd84d';g.beginPath();g.arc(Math.sin(e.t/20)*8,4,10,0,7);g.fill();}
  else if(e.type==='tank'){g.beginPath();g.roundRect(-28,-24,56,48,10);g.fill();g.shadowBlur=0;g.fillStyle='#0a2a3a';g.fillRect(-6,10,12,22);g.beginPath();g.arc(0,0,11,0,7);g.fill();}
  else if(e.type==='gunner'){g.beginPath();for(let i=0;i<6;i++){const a=i/6*Math.PI*2+e.t/40;g.lineTo(Math.cos(a)*22,Math.sin(a)*22);}g.fill();g.shadowBlur=0;g.fillStyle='#2a0a3a';g.beginPath();g.arc(0,0,8,0,7);g.fill();}
  else if(e.type==='kami'){g.rotate(e.dir?Math.atan2(e.dir[1],e.dir[0])-Math.PI/2:0);g.beginPath();g.moveTo(0,18);g.lineTo(-12,-14);g.lineTo(12,-14);g.fill();}
  else{g.beginPath();g.moveTo(0,20);g.lineTo(-20,-10);g.lineTo(-8,-18);g.lineTo(8,-18);g.lineTo(20,-10);g.closePath();g.fill();g.shadowBlur=0;g.fillStyle='#300';g.fillRect(-8,-8,5,5);g.fillRect(3,-8,5,5);}
  g.restore();
  if(!e.boss&&e.hp<e.max){g.fillStyle='#0008';g.fillRect(e.x-18,e.y-e.r-10,36,4);g.fillStyle='#7f7';g.fillRect(e.x-18,e.y-e.r-10,36*Math.max(0,e.hp/e.max),4);}
}
function draw(){
  g.fillStyle='#05030f';g.fillRect(0,0,W,H);
  const neb=g.createRadialGradient(W*.3,H*.3,10,W*.3,H*.3,400);neb.addColorStop(0,'#2a1a6a55');neb.addColorStop(1,'#0000');g.fillStyle=neb;g.fillRect(0,0,W,H);
  for(const s of stars){g.fillStyle='rgba(255,255,255,'+(s.z/2.3)+')';g.fillRect(s.x,s.y,s.z,s.z*(state==='play'?3:1));}
  if(!P)return;
  g.save();if(shake)g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  for(const d of drops){g.save();g.translate(d.x,d.y);
    if(d.type==='coin'){const s=Math.abs(Math.cos(frameN/8+d.x));g.fillStyle='#ffd84d';g.beginPath();g.ellipse(0,0,8*s+1,8,0,0,7);g.fill();}
    else{g.fillStyle={heal:'#ff4f6d',power:'#7ef9ff',shield:'#4dff9a'}[d.type];g.shadowColor=g.fillStyle;g.shadowBlur=14;g.beginPath();g.arc(0,0,13,0,7);g.fill();g.shadowBlur=0;g.fillStyle='#000';g.font='bold 14px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText({heal:'+',power:'P',shield:'S'}[d.type],0,1);}
    g.restore();}
  g.fillStyle='#9ffcff';for(const b of bul){g.fillRect(b.x-2,b.y-9,4,16);}
  for(const b of ebul){g.fillStyle=b.col;g.shadowColor=b.col;g.shadowBlur=10;g.beginPath();g.arc(b.x,b.y,b.r,0,7);g.fill();}g.shadowBlur=0;
  for(const e of en)drawEnemy(e);
  if(!P.dead){const sh=SHIPS[save.ship];if(!(P.inv>0&&Math.floor(P.inv/5)%2))shipPath(g,P.x,P.y,1.2,sh.c,sh.a,true);
    if(P.inv>100){g.strokeStyle='#4dff9a88';g.lineWidth=3;g.beginPath();g.arc(P.x,P.y,34,0,7);g.stroke();}}
  for(const p of parts){g.globalAlpha=Math.max(0,p.life);g.fillStyle=p.col;g.fillRect(p.x,p.y,p.r,p.r);}g.globalAlpha=1;
  g.restore();
  // HUD
  g.font='bold 20px system-ui,sans-serif';g.fillStyle='#fff';g.textAlign='left';g.fillText('Очки '+score,16,76);g.fillStyle='#ffd84d';g.fillText('🪙 '+runCoins,16,102);
  g.textAlign='right';g.fillStyle='#fff';g.fillText('Волна '+wave,W-16,32);
  for(let i=0;i<P.maxHp;i++){g.fillStyle=i<P.hp?'#ff4f6d':'#ffffff22';g.fillText('♥',W-16-i*22,58);}
  if(P.dbl>0){g.fillStyle='#7ef9ff';g.fillText('P×2 '+Math.ceil(P.dbl/60),W-16,84);}
  const boss=en.find(e=>e.boss);if(boss){g.fillStyle='#0009';g.fillRect(100,72,W-200,12);g.fillStyle='#ff4f6d';g.fillRect(100,72,(W-200)*Math.max(0,boss.hp/boss.max),12);}
  if(banner){g.textAlign='center';g.globalAlpha=Math.min(1,banner.t/30);g.font='900 52px system-ui,sans-serif';g.fillStyle=banner.txt.includes('БОСС')?'#ff4f6d':'#7ef9ff';g.fillText(banner.txt,W/2,H/2-40);
    g.font='20px system-ui,sans-serif';g.fillStyle='#fff';g.fillText(banner.sub,W/2,H/2-8);g.globalAlpha=1;}
  g.textAlign='left';
}
let lastT=0,acc=0;
function loop(ts){acc+=Math.min(100,ts-lastT)/16.67;lastT=ts;let n=0;while(acc>=1&&n<4){update();acc--;n++;}if(n>=4)acc=0;draw();requestAnimationFrame(loop);}
requestAnimationFrame(loop);

/* ---------- ввод ---------- */
addEventListener('keydown',e=>{if(lb.isOpen())return;keys[e.code]=true;if(e.code.startsWith('Arrow')||e.code==='Space')e.preventDefault();
  if((e.code==='Escape'||e.code==='KeyP')){if(state==='play'){state='pause';store();showUI('pauseUI');}else if(state==='pause')resume();}});
addEventListener('keyup',e=>keys[e.code]=false);
addEventListener('pagehide',store);
addEventListener('blur',()=>{keys={};if(state==='play'){state='pause';store();showUI('pauseUI');}});
function cpos(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
// Мышь ведёт корабль за собой, а палец управляет джойстиком (он появляется там, где коснулся экрана).
cv.addEventListener('pointermove',e=>{if(e.pointerType==='mouse')ptr=cpos(e);});
cv.addEventListener('pointerdown',e=>{ac();if(e.pointerType==='mouse')ptr=cpos(e);});
const joy=FreasyJoystick({target:document.body,axes:'xy',enabled:()=>state==='play',onStart:()=>{ac();ptr=null;}});

/* ---------- меню ---------- */
function showUI(id){document.querySelectorAll('.ui').forEach(u=>u.classList.toggle('on',u.id===id));}
function resume(){state='play';showUI(null);}
function menu(){state='menu';showUI('menu');
  $('#menuInfo').innerHTML='🏆 Рекорд: '+save.best+' · лучшая волна: '+save.bestWave+'<br>🪙 '+save.coins+' монет · 💀 врагов сбито: '+save.kills;
  $('#bCont').style.display=save.check>0?'':'none';$('#bCont').textContent='⟳ Продолжить с волны '+(save.check+1);}
function shipIcon(i){const c=document.createElement('canvas');c.width=70;c.height=70;const x=c.getContext('2d');shipPath(x,35,38,1.1,SHIPS[i].c,SHIPS[i].a,false);return c;}
function renderShop(){
  $('#shopCoins').textContent='🪙 '+save.coins+' монет';
  $('#shopGrid').innerHTML=UPS.map(u=>{const l=save.ups[u.k],full=l>=u.max,c=u.cost(l);
    return '<div class="up"><b>'+u.n+'</b><span class="muted" style="font-size:12px">'+u.d+'</span><div class="bar">'+Array.from({length:u.max},(_,i)=>'<i class="'+(i<l?'on':'')+'"></i>').join('')+'</div><button data-k="'+u.k+'" '+(full||save.coins<c?'disabled':'')+'>'+(full?'МАКС':'🪙 '+c)+'</button></div>';}).join('');
  document.querySelectorAll('.up button').forEach(b=>b.onclick=()=>{const u=UPS.find(x=>x.k===b.dataset.k);const c=u.cost(save.ups[u.k]);if(save.coins>=c&&save.ups[u.k]<u.max){save.coins-=c;save.ups[u.k]++;store();S.power();renderShop();}});
  const sg=$('#shipGrid');sg.innerHTML='';
  SHIPS.forEach((s,i)=>{const d=document.createElement('div');d.className='ship'+(save.ship===i?' on':'');d.appendChild(shipIcon(i));const own=save.owned.includes(i);
    d.insertAdjacentHTML('beforeend','<b>'+s.n+'</b><div class="muted" style="font-size:12px">'+(own?(save.ship===i?'выбран':'выбрать'):'🪙 '+s.p)+'</div>');
    d.onclick=()=>{if(!own){if(save.coins<s.p)return;save.coins-=s.p;save.owned.push(i);S.coin();}save.ship=i;store();renderShop();};sg.appendChild(d);});
  showUI('shopUI');
}
let runStart=0,runT=0;
const lb=FreasyLeaderboard({key:'patrul',
  boards:[{id:'score',title:'Очки',column:'best_score',order:'desc',note:'Больше всего очков за один полёт.',format:v=>v+' очк.'},
    {id:'wave',title:'Волна',column:'best_wave',order:'desc',note:'Самая дальняя волна, до которой удалось долететь.',format:v=>'волна '+v}],
  bests:()=>[save.runScore,save.runWave].filter(Boolean),onStatus:t=>{$('#lbNote').textContent=t;}});
document.querySelectorAll('[data-lb]').forEach(b=>b.onclick=()=>lb.open());
$('#bPlay').onclick=()=>{ac();newRun(0);};
$('#bCont').onclick=$('#bOverCont').onclick=()=>{ac();newRun(save.check);};
$('#bAgain').onclick=()=>{ac();newRun(0);};
$('#bShop').onclick=$('#bOverShop').onclick=renderShop;
$('#bResume').onclick=resume;
$('#bQuit').onclick=()=>{store();P=null;menu();};
document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{P=null;menu();});
$('#bReset').onclick=()=>{if(confirm('Удалить весь прогресс, монеты и улучшения?')){localStorage.removeItem(KEY);save=load();menu();}};
menu();
if(location.hash==='#preview'){newRun(3);P.inv=1e9;ptr={x:W/2,y:H-160};for(let i=0;i<520;i++)update();P.inv=0;}
</script>
