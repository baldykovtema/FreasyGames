<!DOCTYPE html>
<html lang="ru">

<head>
<script src="../shared/session.js?v=2"></script>
<script src="../shared/guard.js?v=1"></script>
<script src="../shared/i18n.js?v=3" data-game="rcfcg"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>RCFCG</title>
    <link rel="stylesheet" href="css/style.css?v=sb3d1">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-fallback.js"></script>
</head>

<body>
    <div id="authScreen">
        <div id="authBox">
            <div id="authTitle">RCFCG</div>
            <input id="usernameInput" class="authInput" type="text" placeholder="Логин" autocomplete="username"
                maxlength="30">
            <input id="passwordInput" class="authInput" type="password" placeholder="Пароль"
                autocomplete="current-password" maxlength="72">
            <button id="loginButton">Войти</button>
            <div id="registerText" style="color:white;margin-top:18px;margin-bottom:2px">Нет аккаунта?</div>
            <button id="registerButton">Зарегистрироваться</button>
            <button id="backToLogin">Назад</button>
            <div id="authMessage"></div>
            <button id="offlineButton" type="button">⚡ Офлайн-режим — без аккаунта</button>
            <div id="offlineNote">Прогресс сохранится только на этом устройстве</div>
        </div>
    </div>
    <div id="game">
        <div id="playerStats">
            <div id="playerStatsName">Игрок</div>
            <div class="statLine">Лучший процент: <span id="bestPercentageStat">0%</span></div>
            <div class="statLine">Время игры: <span id="playTimeStat">0с</span></div>
            <div class="statLine">Открытые кубы: <span id="cubesCompletedStat">0</span></div>
        </div>
        <div id="unlockInfo"></div>
        <div id="donut" role="button" tabindex="0" aria-label="Собрать пончик">🍩</div>
        <div id="goldenDonut" role="button" tabindex="0" aria-label="Собрать золотой пончик"></div>
        <div id="donutBoostInfo">🍩 Бонус: шанс x2.5!</div>
        <div id="adminPanel">
            <div id="adminPanelTitle">⚙ Панель тестирования</div>
            <button id="spawnDonutButton">Вызвать пончик</button>
            <button id="spawnGoldenDonutButton">Вызвать золотой пончик</button>
            <input id="adminCubeInput" type="number" min="0" placeholder="Количество открытых кубов">
            <button id="adminSaveButton">Сохранить количество</button>
            <button id="adminResetButton">Установить 0</button>
            <div id="adminMessage"></div>
        </div>
        <div id="gameArea">
            <div id="cubes"></div>
        </div>
        <div id="topRightControls">
            <div class="donutTimers"><div id="donutTimer">🍩 --:--</div>
            <div id="goldenDonutTimer">Золотой 🍩 --:--</div></div>
            <button id="logoutButton">Выйти</button>
        </div>
        <div id="controls">
            <label id="autoClickMode">
                <input type="checkbox" id="autoClickCheckbox" disabled>
                <span>Автокликер</span>
            </label>
            <label id="fastMode">
                <input type="checkbox" id="fastModeCheckbox" disabled>
                <span>Быстрый режим</span>
            </label>
            <label id="disableAllMode">
                <input type="checkbox" id="disableAllCheckbox">
                <span>Отключить всё кроме заново</span>
            </label>
            <button id="addCube">Добавить куб 1/1</button>
            <button id="removeCube" style="display:none">Убрать куб</button>
            <button id="restart">Заново</button>
            <button id="leaderboardButton">Таблицы лидеров</button>
        </div>
    </div>
    <div id="leaderboardScreen">
        <div id="leaderboardTitle">Таблица лидеров</div>
        <div id="leaderboardTabs">
            <button class="lbTab active" data-mode="percentage">Проценты</button>
            <button class="lbTab" data-mode="time">Время</button>
            <button class="lbTab" data-mode="cubes">Кубы</button>
        </div>
        <div id="podium">
            <div class="lbSlot" id="slot0">
                <div class="lbRank" style="color:#ffd700">1</div>
                <div class="lbCubeWrap"><canvas></canvas>
                    <div class="lbPercentage"></div>
                </div>
                <div class="lbName">—</div>
            </div>
            <div class="lbSlot" id="slot1">
                <div class="lbRank" style="color:#c0c0c0">2</div>
                <div class="lbCubeWrap"><canvas></canvas>
                    <div class="lbPercentage"></div>
                </div>
                <div class="lbName">—</div>
            </div>
            <div class="lbSlot" id="slot2">
                <div class="lbRank" style="color:#cd7f32">3</div>
                <div class="lbCubeWrap"><canvas></canvas>
                    <div class="lbPercentage"></div>
                </div>
                <div class="lbName">—</div>
            </div>
        </div>
        <div id="leaderboardMessage"></div>
        <button id="leaderboardBack">Назад</button>
    </div>
    <script src="../shared/rewards.js"></script>
    <script src="js/config.js?v=sb3d1"></script>
    <script src="js/utils.js?v=sb3d1"></script>
    <script src="js/state.js?v=sb3d1"></script>
    <script src="js/stats.js?v=sb3d1"></script>

    <script src="js/cubes.js?v=sb3d1"></script>
    <script src="js/donut.js?v=sb3d1"></script>
    <script src="js/auth.js?v=sb3d1"></script>
    <script src="js/leaderboard.js?v=sb3d1"></script>
    <script src="js/main.js?v=sb3d1"></script>
<script src="../shared/back.js" data-href="../"></script>
</body>

</html>
